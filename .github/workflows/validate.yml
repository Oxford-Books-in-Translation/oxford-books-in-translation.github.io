name: Checks

# Runs on every push and pull request, so a bad country code, a misspelled
# language, or a palette change that breaks contrast is caught before anyone
# opens the map.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No dependencies to install — both checks are plain Node.
      - name: Validate data/books.csv
        run: node scripts/validate-books.mjs

      - name: Check colour contrast and colour-vision safety
        run: node scripts/check-contrast.mjs
